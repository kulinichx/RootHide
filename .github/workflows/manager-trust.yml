name: Build Manager Trust candidates

on:
  push:
    branches:
      - codex/manager-trust-20261027
    paths:
      - tools/manager-trust/**
      - .github/workflows/manager-trust.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate and package
        run: |
          set -euo pipefail
          python3 tools/manager-trust/test_build.py
          python3 tools/manager-trust/build.py --output artifacts/manager-trust
          dpkg --compare-versions '3.2.1-5+trust1' gt '3.2.1-5'
          dpkg --compare-versions '3.2.1-5+trust1' gt '3.2.1-3'
          dpkg --compare-versions '3.2.1-5+trust1' lt '3.2.1-6'
          dpkg --compare-versions '1.3.9+trust1' gt '1.3.9+bindtrust1'
          dpkg --compare-versions '1.3.9+trust1' gt '1.3.9+bindtrust1+analysis1.0.17'
          dpkg --compare-versions '1.3.9+trust1' lt '1.3.10'
          for deb in artifacts/manager-trust/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          git rev-parse HEAD > artifacts/manager-trust/source-commit.txt
          cp tools/manager-trust/README.md artifacts/manager-trust/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: manager-trust-candidates
          path: artifacts/manager-trust/
          if-no-files-found: error
          retention-days: 30
  apple-inspect:
    needs: package
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          name: manager-trust-candidates
          path: artifacts/manager-trust
      - name: Parse both Mach-O slices and entitlement blobs with Apple tools
        run: python3 tools/manager-trust/apple_inspect.py
      - uses: actions/upload-artifact@v4
        with:
          name: manager-trust-apple-inspection
          path: artifacts/manager-trust/apple-inspection.json
          if-no-files-found: error
          retention-days: 30
